# Blueprint Render — https://render.com/docs/blueprint-spec
# Déploie le serveur Node (server.js) qui sert le frontend ET l'API /api/chat.
services:
  - type: web
    name: venice-chatbot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: HF_TOKEN
        sync: false # à renseigner dans le dashboard Render (jamais dans le repo)
      - key: HF_MODEL
        value: dphn/Dolphin-Mistral-24B-Venice-Edition
      - key: HF_PROVIDER
        value: featherless-ai
