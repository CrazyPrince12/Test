<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Venice</title>
  <meta name="description" content="Venice — le chatbot IA créé par Crazy Prince Dev." />
  <meta name="author" content="Crazy Prince Dev" />
  <meta name="theme-color" content="#04202f" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Venice" />
  <meta property="og:title" content="Venice — chatbot IA" />
  <meta property="og:description" content="Venice, le chatbot IA créé par Crazy Prince Dev." />
  <meta property="og:image" content="/assets/venice.svg" />

  <link rel="icon" href="/assets/venice.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/assets/venice.svg" />
  <link rel="stylesheet" href="/style.css?v=20260904" />
</head>
<body>
  <!-- Décor : profondeurs marines + bulles animées (GSAP). -->
  <div class="ocean" aria-hidden="true">
    <div class="ocean-glow"></div>
    <div class="ocean-caustics"></div>
    <div id="bubbles" class="bubbles"></div>
  </div>

  <header class="app-header" role="banner">
    <div class="brand">
      <img class="brand-logo" src="/assets/venice.svg" width="44" height="44" alt="Venice" />
      <span class="brand-name">Venice</span>
    </div>

    <div class="header-actions">
      <span id="status-badge" class="status-badge is-loading" title="État de la connexion au serveur">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="status-text">connexion…</span>
      </span>
      <button id="clear-chat" class="icon-button" type="button" aria-label="Effacer la conversation" title="Effacer la conversation">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-trash"></use></svg>
      </button>
    </div>
  </header>

  <main id="chat" class="chat">
    <div id="empty-state" class="empty-state">
      <img id="empty-logo" class="empty-logo" src="/assets/venice.svg" width="104" height="104" alt="" />
      <h1 id="greeting" class="greeting"></h1>
      <p id="empty-subtitle" class="empty-subtitle">
        Je suis <strong>Venice</strong>, l'assistant créé par Crazy Prince Dev.
      </p>
    </div>

    <div id="messages" class="messages" role="log" aria-live="polite" aria-label="Conversation"></div>
  </main>

  <footer class="composer-wrap">
    <form id="chat-form" class="composer" autocomplete="off">
      <label for="user-input" class="sr-only">Votre message à Venice</label>
      <textarea
        id="user-input"
        name="message"
        rows="1"
        placeholder="Écris à Venice…"
        aria-label="Écris à Venice"
        enterkeyhint="send"
      ></textarea>
      <button id="send-btn" class="send-button" type="submit" aria-label="Envoyer le message" title="Envoyer">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-send"></use></svg>
      </button>
    </form>
    <p class="composer-note">
      Powered by Crazy Prince <span class="sep" aria-hidden="true">|</span> From Cameroun
      <img class="flag" src="/assets/flag-cameroun.svg" width="21" height="14" alt="Cameroun" />
    </p>
  </footer>

  <div id="error-toast" class="error-toast" role="alert" hidden></div>

  <!-- Bibliothèque d'icônes SVG (aucun emoji dans l'interface). -->
  <svg class="svg-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-trash" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"
              d="M4 7h16M10 4h4a1 1 0 0 1 1 1v2H9V5a1 1 0 0 1 1-1Zm-4 3 1 12.2A1.8 1.8 0 0 0 8.8 21h6.4a1.8 1.8 0 0 0 1.8-1.8L18 7M10 11v6M14 11v6"/>
      </symbol>
      <symbol id="i-send" viewBox="0 0 24 24">
        <path fill="currentColor" d="M3.4 20.4 21 12 3.4 3.6l-.02 6.53L15.5 12 3.38 13.87Z"/>
      </symbol>
      <symbol id="i-user" viewBox="0 0 24 24">
        <path fill="currentColor" d="M12 12a4.2 4.2 0 1 0 0-8.4 4.2 4.2 0 0 0 0 8.4Zm0 1.8c-3.5 0-7.4 1.8-7.4 4.6v1.2a1 1 0 0 0 1 1h12.8a1 1 0 0 0 1-1v-1.2c0-2.8-3.9-4.6-7.4-4.6Z"/>
      </symbol>
      <symbol id="i-copy" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"
              d="M9 9V5.8A1.8 1.8 0 0 1 10.8 4h7.4A1.8 1.8 0 0 1 20 5.8v7.4a1.8 1.8 0 0 1-1.8 1.8H15M5.8 9h7.4A1.8 1.8 0 0 1 15 10.8v7.4A1.8 1.8 0 0 1 13.2 20H5.8A1.8 1.8 0 0 1 4 18.2v-7.4A1.8 1.8 0 0 1 5.8 9Z"/>
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m5 12.8 4.4 4.4L19 7.6"/>
      </symbol>
      <symbol id="i-alert" viewBox="0 0 24 24">
        <path fill="currentColor" d="M12 3.2 1.6 20.8h20.8L12 3.2Zm.9 13.1h-1.8v1.8h1.8v-1.8Zm0-6.6h-1.8v5h1.8v-5Z"/>
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/>
      </symbol>
    </defs>
  </svg>

  <script src="/vendor/gsap.min.js"></script>
  <script src="/app.js?v=20260904" type="module"></script>
</body>
</html>
